<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5C2D91" />
    <meta name="description" content="SpeakUp — DP World Kigali Safety Reporting System. Report hazards before they become incidents." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <title>SpeakUp | DP World Kigali</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var key = 'speakup-flush-sw-20260908-locations';
        try {
          if (localStorage.getItem(key) === 'done') return;
          localStorage.setItem(key, 'done');
        } catch (e) {}
        var reload = function () { location.reload(); };
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (names) {
            return Promise.all(names.map(function (name) { return caches.delete(name); }));
          }));
        }
        if (jobs.length) Promise.all(jobs).then(reload).catch(reload);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
